services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # These values are taken from the .env file
      MYSQL_DATABASE: ${CB_DB_NAME}
      MYSQL_USER: ${CB_DB_USERNAME}
      MYSQL_PASSWORD: ${CB_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DEFAULT_AUTH: caching_sha2_password
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-booking_agent}
    volumes:
      - chartbrew-db:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    environment:
      CB_REDIS_HOST: redis
      REDIS_PASSWORD: ${CB_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  chartbrew:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Feel free to remap these ports on the left side to your desired ports.
      # If you do change these ports you also need to update them in the VITE_APP_CLIENT_HOST and VITE_APP_API_HOST variables in your .env file
      - 4018:4018 # Frontend
      - 4019:4019 # API
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    links:
      - db
      - redis

  booking-agent:
    build: ./services/ai-booking-agent
    restart: unless-stopped
    ports:
      - ${BOOKING_PORT:-3001}:${BOOKING_PORT:-3001}
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${CB_DB_USERNAME}
      DB_PASSWORD: ${CB_DB_PASSWORD}
      DB_NAME: ${BOOKING_DB_NAME:-booking_agent}
      BOOKING_PORT: ${BOOKING_PORT:-3001}
      BOOKING_PUBLIC_HOSTNAME: ${BOOKING_PUBLIC_HOSTNAME:-localhost}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      BOOKING_OPENAI_API_KEY: ${BOOKING_OPENAI_API_KEY}
      BOOKING_OPENAI_MODEL: ${BOOKING_OPENAI_MODEL:-gpt-4o-mini}
      BUSINESS_NAME: ${BUSINESS_NAME:-My Business}
      BUSINESS_HOURS: ${BUSINESS_HOURS:-Mon-Fri 9am-6pm}
      BUSINESS_SERVICES: ${BUSINESS_SERVICES:-General}
      BOOKING_API_KEY: ${BOOKING_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  chartbrew-db:
