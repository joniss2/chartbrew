services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CB_DB_NAME}
      MYSQL_USER: ${CB_DB_USERNAME}
      MYSQL_PASSWORD: ${CB_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DEFAULT_AUTH: caching_sha2_password
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-booking_agent}
    volumes:
      - chartbrew-db:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chartbrew:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - ${VITE_APP_CLIENT_PORT:-4018}:${VITE_APP_CLIENT_PORT:-4018}
      - ${CB_API_PORT:-4019}:${CB_API_PORT:-4019}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    links:
      - db
      - redis

  booking-agent:
    build: ./services/ai-booking-agent
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${CB_DB_USERNAME}
      DB_PASSWORD: ${CB_DB_PASSWORD}
      DB_NAME: ${BOOKING_DB_NAME:-booking_agent}
      PORT: 3001
      PUBLIC_HOSTNAME: ${BOOKING_PUBLIC_HOSTNAME:-localhost:3001}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      OPENAI_API_KEY: ${BOOKING_OPENAI_API_KEY}
      OPENAI_MODEL: ${BOOKING_OPENAI_MODEL:-gpt-4o-mini}
      BUSINESS_NAME: ${BUSINESS_NAME:-Mein Salon}
      BUSINESS_HOURS: ${BUSINESS_HOURS:-Mo-Fr 9-18 Uhr}
      BUSINESS_SERVICES: ${BUSINESS_SERVICES:-Haarschnitt,Faerben,Bart trimmen}
    ports:
      - ${BOOKING_PORT:-3001}:3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  chartbrew-db:
